[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geosar"
version = "1.0.0"
description = "Python library for Synthetic Aperture Radar (SAR) processing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Santosh Kumar Singh" }
]

keywords = [
    "SAR",
    "Synthetic Aperture Radar",
    "Remote Sensing",
    "Flood Detection",
    "Sentinel-1",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "rasterio>=1.3",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sar*"]

[tool.ruff]
target-version = "py310"
line-length = 88

exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".ipynb_checkpoints",

    "sar/examples",
    "sar/docs",
    "sar/archive",
    "sar/debug",
    "sar/benchmarks",
    "sar/*.ipynb",
    "sar/dev_tests.ipynb",
    "sar/tests",
    "sar/validation",
]
