[tool.ruff]

target-version = "py310"
line-length = 88

exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".ipynb_checkpoints",

    "sar/examples",
    "sar/docs",
    "sar/archive",
    "sar/debug",
    "sar/benchmarks",
    "sar/*.ipynb",
    "sar/dev_tests.ipynb",
    "sar/tests",
    "sar/validation",
]
