[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================================
# Project Metadata
# ============================================================================

[project]
name = "geosar"
version = "1.0.0"
description = "A modular Python library for Synthetic Aperture Radar (SAR) image processing and flood detection."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

authors = [
    {name = "Santosh Kumar Singh"}
]

keywords = [
    "SAR",
    "Synthetic Aperture Radar",
    "Sentinel-1",
    "Flood Detection",
    "Remote Sensing",
    "Geospatial",
    "Earth Observation",
    "Image Processing"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent"
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "pyproj>=3.5.0",
    "geopandas>=0.14.0"
]

# ============================================================================
# Project URLs
# ============================================================================

[project.urls]
Homepage = "https://github.com/<your_username>/GeoSAR"
Documentation = "https://github.com/<your_username>/GeoSAR"
Repository = "https://github.com/<your_username>/GeoSAR"
Issues = "https://github.com/<your_username>/GeoSAR/issues"

# ============================================================================
# Package Discovery
# ============================================================================

[tool.setuptools.packages.find]
include = ["sar*"]

# ============================================================================
# Optional Development Dependencies
# ============================================================================

[project.optional-dependencies]

dev = [
    "pytest>=8.0",
    "black>=24.0",
    "flake8>=7.0",
    "jupyter>=1.0"
]

